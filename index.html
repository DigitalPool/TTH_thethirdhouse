<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>NA Logo Masked Draw Animation</title>

	<style>
		body {
			margin: 0;
			background: #ffffff;
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
		}

		#na-preview {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		svg {
			width: 420px; /* preview size */
			height: auto;
		}

		/* Filled logo letters revealed by the masks */
		#logo-n,
		#logo-a {
			fill: #000;
		}

		/* Mask strokes, white reveals the fill underneath */
		.mask-stroke {
			fill: none;
			stroke: #fff;
			stroke-width: 150px;
			stroke-linecap: round;
			stroke-linejoin: round;
		}
	</style>
</head>
<body>

<div id="na-preview">
	<svg id="na-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 693.11 927.44">

		<defs>
			<mask id="mask-n" maskUnits="userSpaceOnUse">
				<rect width="100%" height="100%" fill="black" />
				<polyline
					id="stroke-n"
					class="mask-stroke"
					points="52.74 629.04 45 45 431.04 640.1 431.04 35.04"
				/>
			</mask>

			<mask id="mask-a" maskUnits="userSpaceOnUse">
				<rect width="100%" height="100%" fill="black" />
				<polyline
					id="stroke-a"
					class="mask-stroke"
					points="55.97 859.16 305.6 849.54 195.3 882.44 195.3 270.95 578.45 882.44 407.71 849.54 648.11 841.8 83.11 671.51 648.11 667.64"
				/>
			</mask>
		</defs>

		<!-- bottom logo. revealed by the masks above -->
		<path
			id="logo-n"
			mask="url(#mask-n)"
			d="M449.97,81.39l-39,.03-.05,448.37-37.13-58.27L119.38,81.35l-88.41.07v532.94h43s.01-453.09.01-453.09l16.05,25.15,86.94,128.16,207.76,306.52h65.23l.12-266.44v-13.47l-.11-259.8Z"
		/>

		<path
			id="logo-a"
			mask="url(#mask-a)"
			d="M596.37,822.77c-11.49-8.48-22.87-17.58-31.57-29.1-11.25-14.92-21.75-29.3-32.07-45.01l-75.21-114.51c-2.25-3.43-4.1-6.54-5.97-10.02l-200.97-305.83s-2.67-5.35-14.25-5.35-58.78,2.46-58.78,2.46l-.59,2.5-.16,106.61-.18,336.34c-2.93,19.2-22.29,36.95-36.37,48.78-25.53,21.44-43.05,17.44-53.95,31.56-4.54,5.87-4.31,12.97,1.18,17.96h191.4s-.04-21.55-.04-21.55c-19.38-3.3-41.3-10.94-47.98-31.1-2.82-9.17-4.27-18.32-4.15-28.2l1.04-88.61h201s49.32,84.85,49.32,84.85c5.01,8.63,7.35,16.66,9.05,25.9-1.57,8.99-4.91,18.09-12.47,23.52-11.31,8.12-24.51,11.88-38.12,13.69l.29,21.31h196.04c4.52-27.74-17.19-21.97-36.49-36.2ZM228.1,655.06l3.12-260.33,176.49,260.26-179.61.07Z"
		/>

	</svg>
</div>

<script>
	document.addEventListener("DOMContentLoaded", () => {
		const strokeN = document.getElementById("stroke-n");
		const strokeA = document.getElementById("stroke-a");
		if (!strokeN || !strokeA) return;

		function setupStroke(el) {
			const length = el.getTotalLength();
			el.style.strokeDasharray = length;
			el.style.strokeDashoffset = length;
			return length;
		}

		setupStroke(strokeN);
		setupStroke(strokeA);

		// force layout
		strokeN.getBoundingClientRect();

		const nDuration = 900;
		const between = 200;
		const aDuration = 900;

		strokeN.style.transition = `stroke-dashoffset ${nDuration}ms ease`;
		strokeN.style.strokeDashoffset = 0;

		setTimeout(() => {
			strokeA.style.transition = `stroke-dashoffset ${aDuration}ms ease`;
			strokeA.style.strokeDashoffset = 0;
		}, nDuration + between);
	});
</script>

</body>
</html>
